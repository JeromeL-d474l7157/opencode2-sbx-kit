# syntax=docker/sandbox-kit:3
# OpenCode v2 as a WORKLOAD, derived from the opencode example of
# docker/sandbox-kit-spec (which ships 1.x): the template image as content
# with opencode replaced by the v2 package (@opencode/cli), seven optional
# proxy-managed provider API keys, the broad egress the multi-provider
# agent needs, and the MCP seed.
#
# Unlike the 1.x example, there is no proxy-managed ChatGPT OAuth: v2 keeps
# credentials in opencode.db and reads the legacy auth.json only in a
# one-time migration of an existing 1.x database, never on a fresh one, so
# a rendered credential file would never be seen.
#
# Version policy: one OpenCode release per build, pinned by the `version`
# arg and checked exactly by the recipe; self-update is off in the image so
# the published provide stays true. See README.md.
schemaVersion: "3"
displayName: OpenCode v2
description: >-
  OpenCode v2 as a complete workload: the sandbox-templates base with
  @opencode/cli pinned to one release, seven optional proxy-managed
  provider credentials, scoped egress, and the MCP seed.
sourceUrl: https://github.com/anomalyco/opencode

kind: workload

args:
  version:
    default: "2.1.2"
    # v2 only: the 1.x line is a different npm package (opencode-ai).
    pattern: '^2\.[0-9]+\.[0-9]+$'
    description: OpenCode v2 release to install (npm @opencode/cli)
    buildArg: OPENCODE_VERSION

provides: ["opencode@${{ kit.args.version }}"]

dockerfile: ./opencode2.dockerfile

capabilities:
  # This workload is an agent sandbox: the host launches the agent rather
  # than running the image's entrypoint as PID 1, and honors the identity
  # the image config declares instead of assuming one.
  - type: com.docker.sandbox/sbx@1

  # Every domain a credential injects into, the OpenAI OAuth endpoint
  # and Codex backend host (for a ChatGPT login done inside the sandbox
  # with `opencode auth login`), and the non-credential domains opencode
  # needs (opencode.ai for `opencode upgrade` and the free models, its
  # model catalog at models.opencode.ai via the wildcard, npm for
  # MCP/plugin installs and manual upgrades, GitHub release assets for LSP
  # auto-install — the githubusercontent zone via the documented
  # single-label wildcard, since assets 302 to its subdomains), and the
  # template's apt mirrors (a workload owns its base).
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com:443
          - claude.ai:443
          - console.anthropic.com:443
          - api.business.githubcopilot.com:443
          - api.enterprise.githubcopilot.com:443
          - api.github.com:443
          - api.githubcopilot.com:443
          - api.individual.githubcopilot.com:443
          - copilot.github.com:443
          - github.com:443
          - "*.githubusercontent.com:443"
          - raw.githubusercontent.com:443
          - codeload.github.com:443
          - aiplatform.googleapis.com:443
          - generativelanguage.googleapis.com:443
          - oauth2.googleapis.com:443
          - vertexai.googleapis.com:443
          - api.groq.com:443
          - api.openai.com:443
          - openai.com:443
          - auth.openai.com:443
          - chatgpt.com:443
          - openrouter.ai:443
          - api.x.ai:443
          - registry.npmjs.org:443
          - opencode.ai:443
          - "*.opencode.ai:443"
          - archive.ubuntu.com:80
          - security.ubuntu.com:80
          - ports.ubuntu.com:80
          - download.docker.com:443
  # Multi-provider credentials, each optional and proxy-managed where a
  # well-known env var exists. The github credential mirrors the copilot
  # kit: one auth format per service, Bearer throughout.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: GitHub and Copilot access
    config:
      service: github
      phase: runtime
      apiKey:
        # Named deliberately (v2 was inject-only): GITHUB_TOKEN is the
        # spelling gh and git tooling read natively, so the sentinel
        # doubles as ambient auth at the allowed hosts.
        name: GITHUB_TOKEN
        proxyManaged: true
        inject:
          - {domain: api.business.githubcopilot.com, header: Authorization, format: "Bearer %s"}
          - {domain: api.enterprise.githubcopilot.com, header: Authorization, format: "Bearer %s"}
          - {domain: api.github.com, header: Authorization, format: "Bearer %s"}
          - {domain: api.githubcopilot.com, header: Authorization, format: "Bearer %s"}
          - {domain: api.individual.githubcopilot.com, header: Authorization, format: "Bearer %s"}
          - {domain: copilot.github.com, header: Authorization, format: "Bearer %s"}
          - {domain: github.com, header: Authorization, format: "Bearer %s"}
          - {domain: raw.githubusercontent.com, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Google AI API access
    config:
      service: google
      phase: runtime
      apiKey:
        name: GOOGLE_GENERATIVE_AI_API_KEY
        proxyManaged: true
        inject:
          - {domain: aiplatform.googleapis.com, header: x-goog-api-key, format: "%s"}
          - {domain: generativelanguage.googleapis.com, header: x-goog-api-key, format: "%s"}
          - {domain: oauth2.googleapis.com, header: x-goog-api-key, format: "%s"}
          - {domain: vertexai.googleapis.com, header: x-goog-api-key, format: "%s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Groq API access
    config:
      service: groq
      phase: runtime
      apiKey:
        name: GROQ_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.groq.com, header: Authorization, format: "Bearer %s"}
  # API key only: the 1.x example's oauth block rendered a ChatGPT token
  # into auth.json, which v2 does not read (see the header comment).
  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI API access
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.openai.com, header: Authorization, format: "Bearer %s"}
          - {domain: openai.com, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Anthropic API access
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}
          - {domain: claude.ai, header: x-api-key, format: "%s"}
          - {domain: console.anthropic.com, header: x-api-key, format: "%s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenRouter API access
    config:
      service: openrouter
      phase: runtime
      apiKey:
        name: OPENROUTER_API_KEY
        proxyManaged: true
        inject:
          - {domain: openrouter.ai, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: xAI API access
    config:
      service: xai
      phase: runtime
      apiKey:
        name: XAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.x.ai, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # The skills mount lands at ~/.config/opencode/skills, and the
        # runtime creates the missing parents for it as root. opencode.json
        # lives beside the mount, so hand both parents back to the agent
        # before the startup merge below tries to write there. Not -R: the
        # skills mount itself is read-only.
        - command: mkdir -p /home/agent/.config/opencode && chown agent:agent /home/agent/.config /home/agent/.config/opencode
          user: "0"
          description: Ensure ~/.config/opencode is owned by agent
      startup:
        # Gateway-first MCP registration, merged with jq rather than
        # overwritten: startup runs on every boot, and opencode.json is
        # the agent's main config, so truncating it would delete user
        # settings and other MCP servers. Deep merge updates only the
        # mcp.servers.mcp-gateway entry; write-temp + rename keeps a crash
        # from leaving a half-written file. No-op when MCP isn't enabled.
        # The fragment uses v2's canonical shape, the one `opencode mcp add`
        # writes (mcp.servers.<name>, no `enabled`, no `$schema`): v2 still
        # accepts the 1.x shape, but mixing both in one file is ambiguous.
        - command: |
            set -e
            [ -n "$MCP_GATEWAY_URL" ] || exit 0
            mkdir -p "$HOME/.config/opencode"
            cfg="$HOME/.config/opencode/opencode.json"
            frag=/tmp/sandbox-mcp-gateway.json
            jq -n --arg url "$MCP_GATEWAY_URL" --arg auth "Bearer $MCP_SENTINEL_TOKEN_NAME" \
              '{mcp: {servers: {"mcp-gateway": {type: "remote", url: $url, headers: {Authorization: $auth}}}}}' > "$frag"
            [ -f "$cfg" ] || echo '{}' > "$cfg"
            jq -s '.[0] * .[1]' "$cfg" "$frag" > "$cfg.tmp"
            mv "$cfg.tmp" "$cfg"
            rm -f "$frag"
          user: agent
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the sandbox MCP gateway by merging into opencode.json

  # Headless verb, so a host can drive a session without the TTY. The
  # entry is an argv tail appended to the entrypoint's launch command.
  - type: com.docker.sandbox/agent-sessions@1
    config:
      prompt: ["run", "{{.Prompt}}"]

  # Interactive verbs, for a host that puts a person at the terminal. Tails
  # append to the entrypoint and run with a terminal attached. The bare
  # command is the TUI, where headless is `run`, so newSession is omitted.
  # There is no sessionPicker (no flag opens one) and no list (the session
  # list is a table or JSON, not one id per line).
  - type: com.docker.sandbox/agent-interactive-sessions@1
    optional: true
    config:
      # `--prompt=` binds the value: a prompt starting with `-` stays one.
      prompt: ["--prompt={{.Prompt}}"]
      continue: ["--continue"]
      resume: ["--session", "{{.SessionID}}"]

  # opencode speaks ACP itself, so the adapter is the agent binary. It
  # reads the same opencode.json the TUI does and starts sessions in the
  # same `build` mode; in v2, session/new offers `plan` as the stricter
  # mode through its `mode` config option (not the older `modes` field).
  # session/new returns the native ses_… id that `--session` resumes, and
  # stdin EOF and SIGTERM each end the process well inside five seconds
  # (measured on 2.1.2: ~10 ms and ~50 ms).
  - type: com.docker.sandbox/acp@1
    optional: true
    description: Drive opencode sessions over the Agent Client Protocol
    config:
      agent: opencode
      command: [opencode, acp]

  # Where opencode reads shared skills, so the host's store reaches it.
  # The runtime also exposes selected agent-skill@1 bundles here, even
  # when host sharing is off or the user has no host skills.
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.config/opencode/skills

  # @1, not the spec example's @2: released sbx versions refuse a required
  # agent-context@2, and Docker's published kits (sbx-kit-opencode,
  # sbx-kit-claude) still declare @1 with a staged contentFile.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      directory: /home/agent/.config/opencode
      contentFile: ./opencode2-context.md
